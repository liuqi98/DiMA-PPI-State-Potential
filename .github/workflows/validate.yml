name: validate-artifact

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q diffcormer_abbind_minexp elsarticle/figures
      - name: Validate JSON artifacts
        run: find . -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Parse shell runners
        run: find diffcormer_abbind_minexp -name '*.sh' -print0 | xargs -0 -n1 bash -n
